# zh_CN / en_US
language: zh_CN

bukkit:
  # Redis 未就绪时是否阻止玩家登录
  blockLoginUntilReady: true

redis:
  host: localhost
  port: 6379
  # 无密码时保持为空
  password: ''
  ssl: false
  # 开启 SSL 后，将 default.jks 放入插件数据目录
  truststorePassword: ''
  timeout: PT15S
  database: 0

  # 0 表示由 Lettuce 自动决定
  ioThreadPoolSize: 0
  computationThreadPoolSize: 0
  autoReconnect: true
  pingBeforeActivateConnection: true

  lifecycle:
    # 等待在途异步操作完成的最长时间
    shutdownGracePeriod: PT10S
    healthCheckPeriod: PT5S
    statusTimeout: PT5S

  sentinel:
    enable: false
    masterId: master
    nodes:
      - '127.0.0.1:26379'
      - '127.0.0.2:26379'
      # IPv6 示例: '[::1]:26379'

  # 主从读写策略，哨兵模式也可同时启用
  slaves:
    enable: false
    # master/masterPreferred/upstream/upstreamPreferred
    # slave/replica/slavePreferred/replicaPreferred
    # nearest/lowestLatency/any/anyReplica
    readFrom: nearest

  cluster:
    # 开启后从 plugins/RedisChannel/clusters/*.yml 读取 seed 节点
    enable: false
    enablePeriodicRefresh: false
    refreshPeriod: PT60S
    enableAdaptiveRefreshTrigger: []
    adaptiveRefreshTriggersTimeout: PT30S
    refreshTriggersReconnectAttempts: 5
    dynamicRefreshSources: true
    closeStaleConnections: true
    maxRedirects: 5
    validateClusterNodeMembership: true

  # API v2 仅使用异步连接池
  pool:
    maxTotal: 8
    maxIdle: 8
    minIdle: 0
